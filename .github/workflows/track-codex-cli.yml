name: Track Codex and Grok CLIs

on:
  schedule:
    # Weekly, Monday 15:00 UTC.
    - cron: "0 15 * * 1"
  workflow_dispatch:

# Push a branch and open a pull request. Do not publish npm, retag, or merge.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: track-codex-cli
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CI_PAT || github.token }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compare tracked CLIs with the latest stable releases
        id: compare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/track-codex-cli.mjs

      - name: Verify app-server against the Codex CLI before pinning it
        if: steps.compare.outputs.update == 'true' && steps.compare.outputs.codex_update == 'true'
        env:
          CODEX_VERSION: ${{ steps.compare.outputs.latest }}
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          npm pack "@openai/codex@${CODEX_VERSION}-linux-x64" --pack-destination "$dir"
          tar -xzf "$dir"/openai-codex-*.tgz -C "$dir"
          bin="$(find "$dir" -type f -path '*/bin/codex' | head -1)"
          test -n "$bin"
          chmod +x "$bin"
          CODEX_BINARY="$bin" node scripts/verify-app-server.mjs

      - name: Record the pin after verification
        if: steps.compare.outputs.update == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CODEX_UPDATE: ${{ steps.compare.outputs.codex_update }}
        run: |
          set -euo pipefail
          args=(--write-if-newer --notes-out /tmp/cli-pr-body.md)
          if [ "$CODEX_UPDATE" = "true" ]; then
            args+=(--protocol-verified)
          fi
          node scripts/track-codex-cli.mjs "${args[@]}"

      - name: Open a pull request when either CLI is newer
        if: steps.compare.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ secrets.CI_PAT || github.token }}
          TITLE: ${{ steps.compare.outputs.title }}
          PACKAGE_VERSION: ${{ steps.compare.outputs.package_version }}
        run: |
          set -euo pipefail
          files=(
            .github/codex-cli.json
            .github/grok-cli.json
            package.json
            package-lock.json
            CHANGELOG.md
            README.md
          )
          rm -rf /tmp/track-files
          mkdir -p /tmp/track-files
          for f in "${files[@]}"; do
            mkdir -p "/tmp/track-files/$(dirname "$f")"
            cp "$f" "/tmp/track-files/$f"
          done
          git checkout -- "${files[@]}"
          git fetch origin main
          branch="automation/track-cli-${PACKAGE_VERSION}"
          git checkout -B "${branch}" origin/main
          for f in "${files[@]}"; do
            mkdir -p "$(dirname "$f")"
            cp "/tmp/track-files/$f" "$f"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- "${files[@]}"; then
            git add "${files[@]}"
            git commit -m "${TITLE}"
            git push --force-with-lease origin "${branch}"
          fi

          existing="$(gh pr list --head "${branch}" --base main --state open --json number --jq 'if length == 0 then "" else .[0].number | tostring end')"
          if [ -n "${existing}" ]; then
            gh pr edit "${existing}" --title "${TITLE}" --body-file /tmp/cli-pr-body.md
          else
            gh pr create --base main --head "${branch}" --title "${TITLE}" --body-file /tmp/cli-pr-body.md
          fi
